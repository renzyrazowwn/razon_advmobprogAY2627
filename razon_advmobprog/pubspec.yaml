name: razon_advmobprog
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  flutter_dotenv: ^5.2.1
